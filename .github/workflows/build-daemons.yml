name: Build daemons (divid69, all platforms)

# The repeatable node-build framework — phase 2 of the DD69 pipeline (the app is
# build-apps.yml in the wallet repo). One trigger builds our refactored core as
# a SELF-CONTAINED `divid69` for every platform, packaged exactly how the wallet
# fetches it at first run: a tar.gz named `divid69-<platform>.tar.gz` containing
# `divid69`(.exe) and `divi69-cli`(.exe) at the top level.
#
# Run it from the Actions tab ("Run workflow") or:  gh workflow run build-daemons.yml
#
# Windows and Linux are cross/native-built on Linux runners via the in-tree
# `depends` system (divi/depends) — the same mechanism Bitcoin Core uses for its
# release binaries, so boost / berkeley-db / libevent / openssl are all built and
# STATICALLY linked by depends. That is what makes the result run on a stranger's
# machine with nothing installed. macOS arm64 is built natively on a Mac runner.
#
# Each job prints the SHA-256 of its tarball: that is the value to pin in the
# wallet's crates/supervisor/src/install.rs `artifact()`, and the tarball is what
# gets published to ~/Divilovescan/public/downloads (scan.divi.love/downloads).

on:
  workflow_dispatch:
  push:
    tags: ["daemon-v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            host: x86_64-pc-linux-gnu
            ext: ""
            pkg: divid69-linux-x86_64.tar.gz
          - name: windows
            os: ubuntu-22.04
            host: x86_64-w64-mingw32
            ext: ".exe"
            pkg: divid69-windows-x86_64.tar.gz
          - name: macos
            os: macos-14           # Apple Silicon runner
            host: native
            ext: ""
            pkg: divid69-macos-arm64.tar.gz

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      # gcc 13+ / clang 15+ dropped transitive <cstdint>/<cstddef>; this old
      # Bitcoin-era source needs them forced in or it fails "uint32_t does not
      # name a type". Harmless where already included.
      SRC_CXXFLAGS: "-O2 -g0 -include cstdint -include cstddef"

    steps:
      - uses: actions/checkout@v4

      # ---- Linux host toolchain (also builds the Windows target via mingw) ----
      - name: Linux/Windows build deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libtool autotools-dev automake \
            pkg-config bsdmainutils curl ca-certificates python3 bison
          if [ "${{ matrix.name }}" = "windows" ]; then
            sudo apt-get install -y g++-mingw-w64-x86-64 g++-mingw-w64-x86-64-posix
            # depends + Bitcoin need the POSIX (not win32) threading variant.
            sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
            sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          fi

      # ---- macOS host toolchain (native arm64 build) ----
      - name: macOS build deps
        if: matrix.name == 'macos'
        run: |
          brew install automake libtool pkg-config boost libevent

      # Berkeley DB 4.8, built from source with the SAME pinned tarball and
      # checksum the depends system uses for Linux and Windows.
      #
      # Homebrew removed berkeley-db@4, which is what broke this job. The
      # tempting fix is to point at berkeley-db@5, and it must NOT be taken: 4.8
      # is the wallet format. A wallet.dat written by 5.x cannot be read back by
      # every other build of this daemon, so Mac users would end up with wallet
      # files the rest of the network's software could not open. Building 4.8
      # ourselves keeps every platform on one format.
      - name: Build Berkeley DB 4.8 (macOS)
        if: matrix.name == 'macos'
        run: |
          set -eu
          BDB_PREFIX="$PWD/bdb48"
          mkdir -p "$BDB_PREFIX" && cd "$BDB_PREFIX"
          curl -fsSLO https://download.oracle.com/berkeley-db/db-4.8.30.NC.tar.gz
          echo "12edc0df75bf9abd7f82f821795bcee50f42cb2e5f76a6a281b85732798364ef  db-4.8.30.NC.tar.gz" \
            | shasum -a 256 -c -
          tar xzf db-4.8.30.NC.tar.gz
          cd db-4.8.30.NC
          # 4.8 predates these names being taken by the C11 atomics header.
          sed -i.old 's/__atomic_compare_exchange/__atomic_compare_exchange_db/' dbinc/atomic.h
          sed -i.old 's/atomic_init/atomic_init_db/' dbinc/atomic.h mp/mp_region.c mp/mp_mvcc.c mp/mp_fget.c mutex/mut_method.c mutex/mut_tas.c
          # These sources are from 2010 and their config.guess/config.sub have
          # never heard of an arm64 Mac, so configure cannot work out what
          # machine it is on and gives up. Use the current ones that ship with
          # automake. (The depends system does the same thing for the same
          # reason, with its own bundled pair — but those predate Apple Silicon
          # too, so on this runner they would not help.)
          AUTOMAKE_SHARE=$(dirname "$(find "$(brew --prefix automake)/share" -name config.sub | head -1)")
          echo "using config files from: $AUTOMAKE_SHARE"
          cp -f "$AUTOMAKE_SHARE/config.guess" "$AUTOMAKE_SHARE/config.sub" dist/
          cd build_unix
          # --with-mutex: 4.8 has no locking case for an arm64 Mac, so it
          # concludes the platform has no mutexes at all and stops with
          # "Unable to find a mutex implementation". Naming the POSIX threads
          # implementation is the standard answer. It affects only how the
          # library locks at runtime, never the on-disk format, so wallet files
          # stay byte-compatible with every other platform's build.
          ../dist/configure --enable-cxx --disable-shared --disable-replication --with-pic \
            --with-mutex=POSIX/pthreads \
            --prefix="$BDB_PREFIX"
          make -j$(sysctl -n hw.ncpu) libdb_cxx-4.8.a libdb-4.8.a
          make install_lib install_include
          echo "BDB_PREFIX=$BDB_PREFIX" >> "$GITHUB_ENV"

      # miniupnpc, the SAME version the depends system pins for Linux and
      # Windows, with the same checksum.
      #
      # Homebrew ships 2.3.x, whose UPNP_GetValidIGD takes two more arguments
      # than this code passes, so the build fails outright. Rather than change
      # networking code to suit one platform's package manager, every platform
      # gets the same library. Consistency here is not tidiness: the UPnP path
      # decides whether a node is reachable, and it should behave identically
      # everywhere.
      - name: Build miniupnpc (macOS)
        if: matrix.name == 'macos'
        run: |
          set -eu
          UPNP_PREFIX="$PWD/upnp"
          mkdir -p "$UPNP_PREFIX" && cd "$UPNP_PREFIX"
          curl -fsSLO http://miniupnp.free.fr/files/miniupnpc-2.0.20170509.tar.gz
          echo "d3c368627f5cdfb66d3ebd64ca39ba54d6ff14a61966dbecb8dd296b7039f16a  miniupnpc-2.0.20170509.tar.gz" \
            | shasum -a 256 -c -
          tar xzf miniupnpc-2.0.20170509.tar.gz
          cd miniupnpc-2.0.20170509
          make -j$(sysctl -n hw.ncpu) INSTALLPREFIX="$UPNP_PREFIX"
          make install INSTALLPREFIX="$UPNP_PREFIX"
          # Delete the shared library so the daemon MUST link the static one.
          # Left in place, the linker prefers the .dylib and bakes in an
          # absolute path inside the build machine's home directory — a binary
          # that runs perfectly in CI and cannot start on any user's Mac.
          rm -f "$UPNP_PREFIX"/lib/*.dylib
          echo "UPNP_PREFIX=$UPNP_PREFIX" >> "$GITHUB_ENV"

      # Cache the depends output (boost / berkeley-db / libevent / openssl built
      # from source) — that compile is most of the run. Keyed on the depends
      # recipes, so it only rebuilds when a package's version/flags change. First-
      # party actions/cache given this project's supply-chain history.
      - name: Cache depends (${{ matrix.host }})
        if: matrix.name != 'macos'
        uses: actions/cache@v4
        with:
          path: |
            divi/depends/built
            divi/depends/sources
            divi/depends/${{ matrix.host }}
          key: depends-${{ matrix.host }}-${{ hashFiles('divi/depends/packages/*.mk', 'divi/depends/hosts/*.mk', 'divi/depends/Makefile') }}

      # ---- Build the depends tree (Linux + Windows) ----
      # NO_QT: we build the daemon only (--without-gui).
      #
      # miniupnpc IS built (NO_UPNP is deliberately NOT set). Without it the
      # daemon has no way to ask the router to open its port, so a node on a
      # home connection can only dial out and nothing can ever dial in. Such a
      # node stakes perfectly well but is invisible to the rest of the network,
      # which is exactly what happened to the Nigeria and UK nodes.
      # No-op (fast) when the cache above already has the built libs.
      - name: Build depends (${{ matrix.host }})
        if: matrix.name != 'macos'
        working-directory: divi/depends
        run: make HOST=${{ matrix.host }} NO_QT=1 -j$(nproc)

      # ---- Configure + make (Linux + Windows, using the depends prefix) ----
      - name: Build divid (${{ matrix.name }})
        if: matrix.name != 'macos'
        working-directory: divi
        run: |
          ./autogen.sh
          CONFIG_SITE=$PWD/depends/${{ matrix.host }}/share/config.site \
            ./configure --prefix=/ --without-gui --disable-tests --disable-bench \
              --with-miniupnpc --enable-upnp-default \
              --with-incompatible-bdb CXXFLAGS="$SRC_CXXFLAGS"
          make -j$(nproc)

      # ---- Configure + make (macOS native, static Homebrew libs) ----
      - name: Build divid (macOS native)
        if: matrix.name == 'macos'
        working-directory: divi
        run: |
          BOOST=$(brew --prefix boost)
          UPNP="$UPNP_PREFIX"   # built from source above; Homebrew ships a newer, incompatible API
          BDB="$BDB_PREFIX"   # built from source above; Homebrew no longer ships 4.8
          EVENT=$(brew --prefix libevent)
          # Symlink the static boost libs into one dir so --with-boost-libdir
          # finds the whole set (unit_test_framework included).
          mkdir -p "$PWD/boost-static"
          ln -sf "$BOOST"/lib/libboost_*.a "$PWD/boost-static/" || true
          ./autogen.sh
          ./configure --without-gui --with-miniupnpc --enable-upnp-default \
            --with-incompatible-bdb \
            --disable-tests --disable-bench \
            --with-boost-libdir="$PWD/boost-static" \
            CPPFLAGS="-I$BDB/include -I$EVENT/include -I$BOOST/include -I$UPNP/include" \
            LDFLAGS="-L$BDB/lib -L$EVENT/lib -L$UPNP/lib" \
            EVENT_LIBS="$EVENT/lib/libevent.a" \
            EVENT_PTHREADS_LIBS="$EVENT/lib/libevent_pthreads.a" \
            CXXFLAGS="$SRC_CXXFLAGS"
          make -j$(sysctl -n hw.ncpu)

      # A Mac binary that depends on a library path inside the build
      # machine's home directory runs in CI and fails for every user. Check
      # before packaging rather than after shipping.
      - name: Refuse a macOS binary that depends on build-machine paths
        if: matrix.name == 'macos'
        working-directory: divi
        run: |
          set -eu
          BAD=$(otool -L src/divid | tail -n +2 | grep -E "/Users/|/opt/homebrew|/usr/local/(opt|Cellar)" || true)
          if [ -n "$BAD" ]; then
            echo "This binary would not start on a user's Mac. It depends on:"
            echo "$BAD"
            exit 1
          fi
          echo "Links only system libraries:"
          otool -L src/divid | tail -n +2

      # ---- Package exactly how the wallet expects to unpack it ----
      - name: Package divid69
        run: |
          set -e
          E="${{ matrix.ext }}"
          OUT="$RUNNER_TEMP/pkg"
          mkdir -p "$OUT"
          cp "divi/src/divid$E"     "$OUT/divid69$E"
          cp "divi/src/divi-cli$E"  "$OUT/divi69-cli$E"
          # Strip symbols (smaller, and the wallet already treats these as opaque).
          if [ "${{ matrix.name }}" = "windows" ]; then
            x86_64-w64-mingw32-strip "$OUT/divid69$E" "$OUT/divi69-cli$E" || true
          else
            strip "$OUT/divid69$E" "$OUT/divi69-cli$E" || true
          fi
          tar -C "$OUT" -czf "${{ matrix.pkg }}" "divid69$E" "divi69-cli$E"
          echo "=== ${{ matrix.pkg }} SHA-256 (pin this in install.rs artifact()) ==="
          shasum -a 256 "${{ matrix.pkg }}" || sha256sum "${{ matrix.pkg }}"

      - name: Upload daemon tarball
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: ${{ matrix.pkg }}
          if-no-files-found: error
